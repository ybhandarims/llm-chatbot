name: Sync Secrets to AWS Secrets Manager

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync secrets to AWS Secrets Manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Sync secrets to AWS Secrets Manager
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          SECRET_NAME="llm-chatbot/openai_api_key"

          # Create or update secret value
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" >/dev/null 2>&1; then
            echo "Secret exists — updating value"
            aws secretsmanager put-secret-value --secret-id "$SECRET_NAME" --secret-string "$OPENAI_API_KEY"
          else
            echo "Creating secret $SECRET_NAME"
            aws secretsmanager create-secret --name "$SECRET_NAME" --secret-string "$OPENAI_API_KEY"
          fi
