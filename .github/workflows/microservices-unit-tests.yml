name: Microservices Unit Tests

on:
  push:
    paths:
      - "microservices/**"
      - "infra/github-actions/microservices-unit-tests.yml"
      - ".github/workflows/microservices-unit-tests.yml"
  pull_request:
    paths:
      - "microservices/**"
      - "infra/github-actions/microservices-unit-tests.yml"
      - ".github/workflows/microservices-unit-tests.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  python-unit-tests:
    name: Python tests - ${{ matrix.service_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: ai-service
            service_path: microservices/ai-service
          - service_name: gateway
            service_path: microservices/gateway
          - service_name: conversations-service
            service_path: microservices/conversations-service
          - service_name: messages-service
            service_path: microservices/messages-service
          - service_name: settings-service
            service_path: microservices/settings-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service_path }}/requirements.txt pytest

      - name: Run fast unit (health) tests and write JUnit XML
        run: |
          mkdir -p reports
          pytest ${{ matrix.service_path }}/tests/test_health.py -q --junitxml=reports/${{ matrix.service_name }}-unit.xml || true

      - name: Upload Python unit test reports
        uses: actions/upload-artifact@v4
        with:
          name: python-unit-reports-${{ matrix.service_name }}
          path: reports/${{ matrix.service_name }}-unit.xml

  frontend-unit-tests:
    name: Frontend tests - microservices/frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: microservices/frontend
        run: npm install

      - name: Run frontend unit tests (Node test runner) and save JSON
        working-directory: microservices/frontend
        run: |
          mkdir -p reports
          node --test --reporter=json tests/*.test.js > reports/frontend-tests.json || true

      - name: Upload frontend test report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: microservices/frontend/reports/frontend-tests.json
