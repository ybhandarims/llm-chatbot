name: CI — Lint, Format, Type Check, Tests, Build, Image Build

on:
  push:
    branches:
      - main
      - release/**
    paths:
      - 'microservices/**'
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - 'microservices/**'
      - 'infra/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint code
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend lint tools
        run: python -m pip install --upgrade pip ruff

      - name: Run backend lint
        run: |
          set -euo pipefail
          if [ -d microservices ]; then
            ruff check microservices/
          else
            echo "microservices directory not found; skipping backend lint"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'microservices/frontend/package-lock.json'

      - name: Install frontend lint tool
        working-directory: microservices/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save eslint

      - name: Run frontend lint
        working-directory: microservices/frontend
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm run lint
          else
            echo "No frontend package.json found; skipping frontend lint"
          fi

  format-validation:
    runs-on: ubuntu-latest
    name: Format validation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend format tool
        run: python -m pip install --upgrade pip black

      - name: Run backend format validation
        run: |
          set -euo pipefail
          if [ -d microservices ]; then
            black --check microservices/
          else
            echo "microservices directory not found; skipping backend format validation"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'microservices/frontend/package-lock.json'

      - name: Install frontend format tool
        working-directory: microservices/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save prettier

      - name: Run frontend format validation
        working-directory: microservices/frontend
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm run format:check
          else
            echo "No frontend package.json found; skipping frontend format validation"
          fi

  type-check:
    runs-on: ubuntu-latest
    name: Type check
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          PY_SERVICES=("gateway" "conversations-service" "settings-service" "messages-service" "ai-service")
          for svc in "${PY_SERVICES[@]}"; do
            svc_path="microservices/$svc"
            if [ -f "$svc_path/requirements.txt" ]; then
              echo "Installing requirements for $svc"
              python -m pip install -r "$svc_path/requirements.txt"
            fi
          done

      - name: Install mypy
        run: python -m pip install --upgrade pip mypy

      - name: Run backend type check
        run: |
          set -euo pipefail
          mypy microservices/gateway \
               microservices/conversations-service \
               microservices/settings-service \
               microservices/messages-service \
               microservices/ai-service \
               --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    name: Run unit & integration tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Prepare test reports directory
        run: mkdir -p reports

      - name: Install pytest and report plugins
        run: python -m pip install --upgrade pip pytest pytest-cov pytest-html

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          PY_SERVICES=("gateway" "conversations-service" "settings-service" "messages-service" "ai-service")
          for svc in "${PY_SERVICES[@]}"; do
            svc_path="microservices/$svc"
            if [ -f "$svc_path/requirements.txt" ]; then
              echo "Installing requirements for $svc"
              python -m pip install -r "$svc_path/requirements.txt"
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'microservices/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: microservices/frontend
        run: npm ci

      - name: Run unit & integration tests
        run: |
          set -euo pipefail
          python microservices/scripts/full_test_pass.py

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-test-reports
          path: |
            reports/*
            microservices/frontend/reports/*
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    name: Build validation
    needs: [lint, format-validation, type-check, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate Python sources compile
        run: python -m compileall microservices

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'microservices/frontend/package-lock.json'

      - name: Validate frontend build if configured
        working-directory: microservices/frontend
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No frontend package.json found; skipping frontend build validation"
            exit 0
          fi

          has_build=$(node -e "const p=require('./package.json'); process.stdout.write((p.scripts && p.scripts.build) ? 'yes' : 'no')")
          if [ "$has_build" = "yes" ]; then
            npm ci
            npm run build
          else
            echo "No npm build script found; skipping frontend build validation"
          fi

  image-build:
    runs-on: ubuntu-latest
    name: Docker image build validation
    needs: [lint, format-validation, type-check, tests, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build all service images locally
        shell: bash
        run: |
          set -euo pipefail
          SERVICES=("gateway" "conversations-service" "settings-service" "messages-service" "ai-service" "frontend")
          for svc in "${SERVICES[@]}"; do
            echo "Building image for $svc"
            docker build -t "llm-chatbot-$svc:${GITHUB_SHA}" "./microservices/$svc"
          done
