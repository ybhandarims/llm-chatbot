name: deploy-chatapp

on:
  workflow_run:
    workflows: ["build-and-push"]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: chatapp-eks
  TF_DIR: terraform
  K8S_DIR: k8s
  K8S_NAMESPACE: chatapp
  APP_DEPLOYMENT_NAME: chatapp
  APP_CONTAINER_NAME: chatapp
  IMAGE_URI: ${{ secrets.ECR_REPOSITORY_URI }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_URI}" ]]; then
            echo "Missing secret: ECR_REPOSITORY_URI"
            exit 1
          fi

          if [[ -z "${TF_STATE_BUCKET}" || -z "${TF_LOCK_TABLE}" ]]; then
            echo "Missing secrets: TF_STATE_BUCKET and/or TF_LOCK_TABLE"
            exit 1
          fi

          if [[ -n "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "Using OIDC role auth"
          elif [[ -n "${AWS_ACCESS_KEY_ID}" && -n "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "Using static AWS keys"
          else
            echo "Set either AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials using static keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.0

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether EKS cluster exists
        id: ekscheck
        shell: bash
        run: |
          set -euo pipefail
          if aws eks describe-cluster --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap infrastructure on first run
        if: ${{ steps.ekscheck.outputs.exists == 'false' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          terraform apply -auto-approve

      - name: Wait for EKS cluster
        shell: bash
        run: |
          set -euo pipefail
          aws eks wait cluster-active --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Update kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Create namespace if missing
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "${K8S_NAMESPACE}" apply -f "${K8S_DIR}/"
          kubectl -n "${K8S_NAMESPACE}" set image deployment/"${APP_DEPLOYMENT_NAME}" \
            "${APP_CONTAINER_NAME}"="${IMAGE_URI}:${{ steps.vars.outputs.image_tag }}"
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/"${APP_DEPLOYMENT_NAME}" --timeout=10m
