name: CD — Push and Deploy

on:
  push:
    branches:
      - main
      - release/**
    paths:
      - 'microservices/**'
      - 'infra/helm/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate AWS deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "Using AWS_ROLE_TO_ASSUME for deployment authentication"
          elif [[ -n "${AWS_ACCESS_KEY_ID}" && -n "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "Using static AWS credentials"
          else
            echo "Set either AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with static keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        shell: bash
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin \
            ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com
        
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID}"
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          fi
          export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=$ECR_REGISTRY"

          SERVICES=("gateway" "conversations-service" "settings-service" "messages-service" "ai-service" "frontend")
          for svc in "${SERVICES[@]}"; do
            case $svc in
              ai-service) imagename="ai-worker" ;;
              conversations-service) imagename="conversations" ;;
              messages-service) imagename="messages" ;;
              settings-service) imagename="settings" ;;
              gateway) imagename="gateway" ;;
              frontend) imagename="frontend" ;;
            esac

            repo_name="llm-chatbot/$imagename"

            if ! aws ecr describe-repositories --repository-names "$repo_name" >/dev/null 2>&1; then
              echo "Creating ECR repository: $repo_name"
              aws ecr create-repository --repository-name "$repo_name" >/dev/null
            fi

            echo "Building $svc -> $ECR_REGISTRY/$repo_name:${GITHUB_SHA}"
            docker build -t "$ECR_REGISTRY/$repo_name:${GITHUB_SHA}" "./microservices/$svc"
            docker push "$ECR_REGISTRY/$repo_name:${GITHUB_SHA}"
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: chatapp-eks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with static keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Helm chart
        shell: bash
        run: |
          set -euo pipefail
          AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID}"
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          fi
          export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG=${GITHUB_SHA}

          set_args=(
            "--set images.frontend.repository=${ECR_REGISTRY}/llm-chatbot/frontend" "--set images.frontend.tag=${TAG}"
            "--set images.gateway.repository=${ECR_REGISTRY}/llm-chatbot/gateway" "--set images.gateway.tag=${TAG}"
            "--set images.settings.repository=${ECR_REGISTRY}/llm-chatbot/settings" "--set images.settings.tag=${TAG}"
            "--set images.conversations.repository=${ECR_REGISTRY}/llm-chatbot/conversations" "--set images.conversations.tag=${TAG}"
            "--set images.messages.repository=${ECR_REGISTRY}/llm-chatbot/messages" "--set images.messages.tag=${TAG}"
            "--set images.ai.repository=${ECR_REGISTRY}/llm-chatbot/ai-worker" "--set images.ai.tag=${TAG}"
          )

          helm upgrade --install llm-chatbot infra/helm/chatapp -n chatapp --create-namespace "${set_args[@]}"
