name: Integration Tests (main)

on:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  python-integration-tests:
    name: Python integration tests - ${{ matrix.service_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: conversations-service
            service_path: microservices/conversations-service
          - service_name: auth-service
            service_path: microservices/auth-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service_path }}/requirements.txt pytest pytest-cov

      - name: Run integration tests and write JUnit XML
        run: |
          mkdir -p reports
          pytest ${{ matrix.service_path }}/tests -q --junitxml=reports/${{ matrix.service_name }}-integration.xml --cov=${{ matrix.service_path }} --cov-report=xml:reports/${{ matrix.service_name }}-coverage.xml --cov-report=html:reports/${{ matrix.service_name }}-htmlcov --cov-report=term-missing || true

      - name: Upload integration test reports
        uses: actions/upload-artifact@v7
        with:
          name: python-integration-reports-${{ matrix.service_name }}
          path: reports/${{ matrix.service_name }}-integration.xml

      - name: Upload integration coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: python-integration-coverage-${{ matrix.service_name }}
          path: |
            reports/${{ matrix.service_name }}-coverage.xml
            reports/${{ matrix.service_name }}-htmlcov

      - name: Publish integration JUnit to Actions
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: integration-tests-${{ matrix.service_name }}
          path: reports/${{ matrix.service_name }}-integration.xml
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}
