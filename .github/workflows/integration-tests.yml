name: Integration Tests (main)

on:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  python-integration-tests:
    name: Python integration tests - ${{ matrix.service_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: conversations-service
            service_path: microservices/conversations-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service_path }}/requirements.txt pytest

      - name: Run integration tests and write JUnit XML
        run: |
          mkdir -p reports
          pytest ${{ matrix.service_path }}/tests/test_api.py -q --junitxml=reports/${{ matrix.service_name }}-integration.xml || true

      - name: Upload integration test reports
        uses: actions/upload-artifact@v4
        with:
          name: python-integration-reports-${{ matrix.service_name }}
          path: reports/${{ matrix.service_name }}-integration.xml
