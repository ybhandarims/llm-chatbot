        env:
        - name: DYNAMODB_TABLE
          value: "conversations"
        - name: SERVICE_NAME
          value: "conversations"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
