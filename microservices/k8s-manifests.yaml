                  values:
                  - conversations
              topologyKey: kubernetes.io/hostname
      containers:
      - name: conversations
        image: llm-chatbot/conversations-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8002
        envFrom:
        - configMapRef:
            name: chatbot-config
