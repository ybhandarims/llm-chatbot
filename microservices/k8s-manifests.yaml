"""
Kubernetes Deployment Manifests for Budget-Conscious Architecture

This file contains the resource definitions for deploying the LLM Chatbot
microservices to an EKS cluster following the budget-conscious architecture.

Features:
- Multi-AZ deployment
- Horizontal Pod Autoscaling (HPA)
- Pod Disruption Budgets (PDB)
- Resource requests/limits
- Health checks (readiness, liveness, startup probes)
- Structured logging
- Network policies
"""

# Deploy using: kubectl apply -f k8s-manifests.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: chatbot
  labels:
    app: llm-chatbot

---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: chatbot
data:
  SETTINGS_URL: "http://settings:8001"
  CONVERSATIONS_URL: "http://conversations:8002"
  MESSAGES_URL: "http://messages:8003"
  AWS_REGION: "us-east-1"
  LOG_LEVEL: "INFO"
  OPENAI_MODEL: "gpt-3.5-turbo"
  SYSTEM_PROMPT: "You are a helpful assistant."
  AUTH_URL: "http://auth:8005"
  REDIS_URL: "redis://redis:6379/0"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secrets
  namespace: chatbot
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-key-here"
  AWS_ACCESS_KEY_ID: "your-key"
  AWS_SECRET_ACCESS_KEY: "your-secret"

---
# Settings Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settings
  namespace: chatbot
  labels:
    app: settings
    service: chatbot
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: settings
  template:
    metadata:
      labels:
        app: settings
        service: chatbot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - settings
              topologyKey: kubernetes.io/hostname
      containers:
      - name: settings
        image: llm-chatbot/settings-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8001
        envFrom:
        - configMapRef:
            name: chatbot-config
        - secretRef:
            name: chatbot-secrets
        env:
        - name: DYNAMODB_TABLE
          value: "settings"
        - name: SERVICE_NAME
          value: "settings"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false

---
# Settings Service
apiVersion: v1
kind: Service
metadata:
  name: settings
  namespace: chatbot
spec:
  selector:
    app: settings
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  type: ClusterIP

---
