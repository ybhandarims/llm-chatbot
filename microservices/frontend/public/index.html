<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microservices Chat UI</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="background-glow"></div>
    <main class="layout">
      <aside class="sidebar">
        <header class="sidebar-header">
          <h1>Chats</h1>
          <button id="new-chat-btn" class="secondary-btn">New</button>
        </header>
        <ul id="conversation-list" class="conversation-list"></ul>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <div>
            <h2>Microservices Demo</h2>
            <p id="status" class="status">Ready</p>
          </div>
          <div class="system-prompt">
            <label for="system-prompt-input">System Prompt</label>
            <textarea id="system-prompt-input" rows="2"></textarea>
            <button id="save-prompt-btn" class="primary-btn">
              Save Prompt
            </button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="chat-form" class="chat-form">
          <textarea
            id="message-input"
            rows="3"
            placeholder="Type your message..."
          ></textarea>
          <button type="submit" class="primary-btn">Send</button>
        </form>
      </section>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
