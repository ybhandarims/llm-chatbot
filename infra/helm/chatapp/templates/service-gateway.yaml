apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
{{ include "chatapp.labels" . | indent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
