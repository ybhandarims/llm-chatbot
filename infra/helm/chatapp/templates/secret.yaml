{{- if .Values.openai.apiKey or .Values.auth.adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chatapp.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
{{- if .Values.openai.apiKey }}
  OPENAI_API_KEY: {{ .Values.openai.apiKey | quote }}
{{- end }}
{{- if .Values.auth.adminPassword }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
{{- end }}
{{- end }}
