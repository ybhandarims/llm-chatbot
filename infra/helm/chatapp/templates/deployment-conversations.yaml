apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversations
  namespace: {{ .Values.namespace }}
  labels:
{{ include "chatapp.labels" . | indent 4 }}
    app.kubernetes.io/component: conversations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: conversations
  template:
    metadata:
      labels:
        app.kubernetes.io/component: conversations
{{ include "chatapp.labels" . | indent 8 }}
    spec:
      containers:
        - name: conversations
          image: {{ .Values.images.conversations.repository }}:{{ .Values.images.conversations.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8002
          env:
            - name: CONVERSATIONS_DB
              value: /data/conversations.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: conversations-data
